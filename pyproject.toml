[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omp-windows-health-monitor"
version = "0.1.0"
description = "Lightweight Windows health monitor for diagnosing freezes, throttling, disk activity, GPU issues, and system events."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Black Osiris Technologies" }
]
dependencies = []

[project.scripts]
omp-windows-health-monitor = "omp_windows_health_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
