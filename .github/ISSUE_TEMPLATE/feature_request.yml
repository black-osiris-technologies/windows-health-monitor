name: Feature request
description: Propose a focused Windows diagnostics improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Diagnostic problem
      description: What failure or investigation workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Privacy and performance impact
      description: Describe collected data, permissions, remote communication, and sampling overhead.
    validations:
      required: true
