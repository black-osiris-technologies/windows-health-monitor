name: Bug report
description: Report a reproducible monitoring, logging, or alerting problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the command and sanitized output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Windows and hardware environment
      description: Windows version, Python version, GPU model, and relevant optional tools.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, hostnames, personal data, and private event-log content.
          required: true
