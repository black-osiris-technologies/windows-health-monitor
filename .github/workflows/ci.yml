name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - develop

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package and tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ruff
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest
